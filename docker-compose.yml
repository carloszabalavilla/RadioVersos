services:
  db:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: catalogo
      MYSQL_USER: radio_demo
      MYSQL_PASSWORD: local-demo-only
      MYSQL_ROOT_PASSWORD: local-root-demo-only
    volumes:
      - ./database/demo.sql:/docker-entrypoint-initdb.d/demo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
  www:
    build: .
    ports: ["127.0.0.1:8084:80"]
    environment:
      DB_HOST: db
      DB_USERNAME: radio_demo
      DB_PASSWORD: local-demo-only
      DB_NAME: catalogo
    depends_on:
      db:
        condition: service_healthy
